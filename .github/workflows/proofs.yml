name: StudioNet clearing envelope proofs
run-name: RankClear — ${{ inputs.scenario }}
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Independent clearing scenario
        type: choice
        default: chain
        options: [chain, cycle, priority, review]
permissions:
  contents: read
concurrency:
  group: rank-clear-studionet-${{ inputs.scenario }}
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RANK_SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned tools
        run: |
          pip install -r requirements-dev.txt
          npm ci --no-audit --no-fund
          genvm-lint download --version v0.2.16
      - name: Lint and run independent fixed-point and consensus tests
        run: |
          genvm-lint check contracts/rank_clear.py --json
          node --test tests/rpc-preflight.test.cjs
          python -m pytest tests/direct -q --junitxml=proofs/cloud-direct-tests.xml
      - name: Prepare encrypted disposable CLI caller
        run: node scripts/bootstrap-ci.cjs
      - name: Deploy and exercise source-derived clearing and rejections
        run: node scripts/live-proof.cjs
      - name: Re-fetch receipts, source, state and stress views
        run: node scripts/verify-proofs.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studionet-proofs
          path: |
            proofs/*.json
            proofs/*.xml
